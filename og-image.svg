    <line x1="432" y1="432" x2="432" y2="466" stroke-width="10"/>
    <line x1="432" y1="498" x2="432" y2="532" stroke-width="10"/>
    <line x1="432" y1="564" x2="432" y2="598" stroke-width="10"/>
    <line x1="768" y1="300" x2="768" y2="334" stroke-width="10"/>

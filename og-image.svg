<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#81c784"/>
      <stop offset="100%" stop-color="#c8e6c9"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#689f38"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#sky)"/>
  <rect y="280" width="1200" height="350" fill="url(#grass)"/>
  <!-- road -->
  <rect x="240" y="280" width="720" height="350" fill="#37474f"/>
  <rect x="240" y="280" width="14" height="350" fill="#ffeb3b"/>
  <rect x="946" y="280" width="14" height="350" fill="#ffeb3b"/>
  <g fill="#fff" opacity="0.35">

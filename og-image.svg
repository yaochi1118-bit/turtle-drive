    <path d="M-102 48 L-102 -90 Q-102 -138 -54 -138 L-54 -138 Q-15 -138 -15 -122 L-15 -122 L15 -122 Q15 -138 54 -138 Q102 -138 102 -90 L102 48 Z" fill="#e53935" stroke="#b71c1c" stroke-width="6"/>
    <path d="M-66 -112 L-54 -122 L54 -122 L66 -112 L66 -84 L-66 -84 Z" fill="#b0bec5"/>
